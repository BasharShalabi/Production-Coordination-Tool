async function handleLogin(event){
  event.preventDefault();
  const button=document.getElementById('loginButton');
  const errorBox=document.getElementById('loginError');
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;

    button.disabled=false;

  button.disabled=false;

function setLiveStatus(kind,text){
  const el=document.getElementById('liveStatus');
  if(!el)return;
  el.className='live-status '+kind;
  el.textContent=text;
}
function showToast(message,isError){
  const el=document.getElementById('toast');
  if(!el)return;
  clearTimeout(toastTimer);
  el.textContent=message;
  el.className='toast show'+(isError?' error':'');
  toastTimer=setTimeout(()=>{el.className='toast'},3600);

function findJobLocation(jobId){
  return Object.keys(state.locations).find(key=>(state.locations[key]||[]).includes(jobId))||'';
}
function remoteJobRow(jobId){
  const job=state.jobs[jobId];
  if(!job)return null;
  const location=findJobLocation(jobId);
  return {
    id:jobId,
    board_id:BOARD_ID,
    job_text:job.text,
    color:Number(job.color)||0,
    note:job.note||'',
    location_key:location,
    position:Math.max((state.locations[location]||[]).indexOf(jobId),0),
    created_at:job.created||new Date().toISOString()
  };
}
function reportRemoteError(error,action){
  console.error(action,error);
  setLiveStatus('error','Sync error');
  const setupMissing=error&&(error.code==='42P01'||/relation .* does not exist/i.test(error.message||''));
  showToast(setupMissing?'Database setup is not finished yet. Run the setup SQL first.':action+' failed. Your local copy is still saved.',true);
}

  if(!row)return;
  const {error}=await db.from('jobs').upsert(row,{onConflict:'id'});
  if(error)reportRemoteError(error,'Saving job');
}
async function deleteRemoteJob(jobId){
  if(!liveReady||!db)return;
  const {error}=await db.from('jobs').delete().eq('board_id',BOARD_ID).eq('id',jobId);
  if(error)reportRemoteError(error,'Deleting job');
}
function queueRemoteSettings(){
  if(!liveReady||!db)return;
  clearTimeout(settingsTimer);
  settingsTimer=setTimeout(saveRemoteSettings,350);
}
async function saveRemoteSettings(){
  if(!liveReady||!db)return;
  const row={
    board_id:BOARD_ID,
    notes:state.notes||'',
    goal:state.goal===''?null:Number(state.goal),
    weeks:state.weeks
  };
  const {error}=await db.from('board_settings').upsert(row,{onConflict:'board_id'});
  if(error)reportRemoteError(error,'Saving board settings');
}
async function syncEntireBoard(){
  if(!liveReady||!db)return;
  setLiveStatus('connecting','Synchronizing');
  const rows=Object.keys(state.jobs).map(remoteJobRow).filter(Boolean);
  const {data:remoteJobs,error:readError}=await db.from('jobs').select('id').eq('board_id',BOARD_ID);
  if(readError){reportRemoteError(readError,'Reading shared jobs');return;}
  if(rows.length){
    const {error}=await db.from('jobs').upsert(rows,{onConflict:'id'});
    if(error){reportRemoteError(error,'Synchronizing jobs');return;}
  }
  const localIds=new Set(rows.map(row=>row.id));
  const removed=(remoteJobs||[]).map(row=>row.id).filter(id=>!localIds.has(id));
  if(removed.length){
    const {error}=await db.from('jobs').delete().eq('board_id',BOARD_ID).in('id',removed);
    if(error){reportRemoteError(error,'Synchronizing deleted jobs');return;}
  }
  await saveRemoteSettings();
  setLiveStatus('live','Live');
}
function applyRemoteJob(payload){
  if(payload.eventType==='DELETE'){
    const id=payload.old&&payload.old.id;
    if(id){delete state.jobs[id];delete remotePositions[id];removeFromLocations(id);}
  }else{
    const row=payload.new;
    if(!row||row.board_id!==BOARD_ID)return;
    state.jobs[row.id]={
      text:row.job_text,
      color:Number(row.color)||0,
      note:row.note||'',
      created:row.created_at||new Date().toISOString()
    };
    remotePositions[row.id]=Number(row.position)||0;
    removeFromLocations(row.id);
    if(row.location_key){
      if(!state.locations[row.location_key])state.locations[row.location_key]=[];
      state.locations[row.location_key].push(row.id);
      state.locations[row.location_key].sort((a,b)=>(remotePositions[a]||0)-(remotePositions[b]||0));
    }
  }
  render();
}
function applyRemoteSettings(payload){
  const row=payload.new;
  if(!row||row.board_id!==BOARD_ID)return;
  state.notes=row.notes||'';
  state.goal=row.goal===null||typeof row.goal==='undefined'?'':String(row.goal);
  state.weeks=Array.isArray(row.weeks)&&row.weeks.length===6?row.weeks:defaultWeeks();
  render();
}
function subscribeToLiveChanges(){
  if(liveChannel)db.removeChannel(liveChannel);
  liveChannel=db.channel('production-board-'+BOARD_ID)
    .on('postgres_changes',{event:'*',schema:'public',table:'jobs'},applyRemoteJob)
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'board_settings'},applyRemoteSettings)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'board_settings'},applyRemoteSettings)
    .subscribe(status=>{
      if(status==='SUBSCRIBED')setLiveStatus('live','Live');
      else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')setLiveStatus('offline','Reconnecting');
      else if(status==='CLOSED')setLiveStatus('offline','Offline');
      else setLiveStatus('connecting','Connecting');
    });
}
async function loadSharedBoard(){
  setLiveStatus('connecting','Loading');
  const localCopy=JSON.parse(JSON.stringify(state));
  const [jobsResult,settingsResult]=await Promise.all([
    db.from('jobs').select('*').eq('board_id',BOARD_ID).order('location_key').order('position'),
    db.from('board_settings').select('*').eq('board_id',BOARD_ID).maybeSingle()
  ]);
  if(jobsResult.error){reportRemoteError(jobsResult.error,'Loading shared jobs');return false;}
  if(settingsResult.error){reportRemoteError(settingsResult.error,'Loading board settings');return false;}

  state=normalizeState({locations:{},jobs:{},notes:'',goal:'',weeks:defaultWeeks()});
  remotePositions={};
  (jobsResult.data||[]).forEach(row=>{
    state.jobs[row.id]={text:row.job_text,color:Number(row.color)||0,note:row.note||'',created:row.created_at};
    remotePositions[row.id]=Number(row.position)||0;
    if(row.location_key){
      if(!state.locations[row.location_key])state.locations[row.location_key]=[];
      state.locations[row.location_key].push(row.id);
    }
  });
  Object.keys(state.locations).forEach(key=>state.locations[key].sort((a,b)=>(remotePositions[a]||0)-(remotePositions[b]||0)));
  if(settingsResult.data){
    const row=settingsResult.data;
    state.notes=row.notes||'';
    state.goal=row.goal===null||typeof row.goal==='undefined'?'':String(row.goal);
    state.weeks=Array.isArray(row.weeks)&&row.weeks.length===6?row.weeks:defaultWeeks();
  }
  liveReady=true;
  render();
  subscribeToLiveChanges();

  if(!(jobsResult.data||[]).length&&Object.keys(localCopy.jobs||{}).length){
    if(confirm('The shared board is empty. Upload the jobs saved in this browser?')){
      state=normalizeState(localCopy);
      render();
      await syncEntireBoard();
    }
  }
  return true;
}
async function initializeLiveBoard(){
  if(!window.supabase){
    setLiveStatus('error','Service unavailable');
    showToast('The live service could not load. Check the internet connection and refresh.',true);
    return;
  }
  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{
    auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}
  });
  db.auth.onAuthStateChange((event,session)=>{
    if(event==='SIGNED_OUT'&&!session){
      liveReady=false;
      showLogin('Your session ended. Sign in again.');
    }
  });
  const {data,error}=await db.auth.getSession();
  if(error){showLogin('The secure service could not verify this device. Refresh and try again.');return;}
  if(data&&data.session){showBoard();await loadSharedBoard();}
  else showLogin('');
}

let selectedColor=0;
let editingJobId=null;
let state={locations:{},jobs:{},notes:'',goal:'',weeks:[]};
let history=[];
let redo=[];

function storageKey(){return 'production_coordination_board_live_v1';}
function defaultWeeks(){return Array.from({length:6},(_,i)=>({date:'',color:i%COLORS.length}));}
function stateTime(obj){
  const t=Date.parse((obj&&obj.updatedAt)||(obj&&obj.exportedAt)||'');
  return Number.isFinite(t)?t:0;
}
function normalizeState(obj){
  const base={locations:{},jobs:{},notes:'',goal:'',weeks:defaultWeeks(),updatedAt:''};
  const next=Object.assign(base,obj&&typeof obj==='object'?obj:{});
  if(!next.locations||typeof next.locations!=='object')next.locations={};
  if(!next.jobs||typeof next.jobs!=='object')next.jobs={};
  if(typeof next.notes!=='string')next.notes='';
  if(typeof next.goal==='undefined'||next.goal===null)next.goal='';
  next.goal=String(next.goal).replace(/[^0-9]/g,'');
  if(!Array.isArray(next.weeks)||next.weeks.length!==6)next.weeks=defaultWeeks();
  return next;
}
function embeddedState(){
  try{
    const el=document.getElementById('initialBoardState');
    if(!el)return null;
    const txt=(el.textContent||'').trim();
    if(!txt||txt==='null')return null;
    return JSON.parse(txt);
  }catch(e){return null;}
}
function loadState(){
  let stored=null;
  try{
    const raw=localStorage.getItem(storageKey());
    if(raw)stored=JSON.parse(raw);
  }catch(e){}
  const embedded=embeddedState();
  if(embedded&&(!stored||stateTime(embedded)>=stateTime(stored))){
    state=normalizeState(embedded);
  }else if(stored){
    state=normalizeState(stored);
  }else{
    state=normalizeState(state);
  }
}
function completedKey(){return locationKey('dept','completed');}
function completedCount(){return jobsFor(completedKey()).filter(id=>state.jobs[id]).length;}
function saveState(){
  state.updatedAt=new Date().toISOString();
  try{localStorage.setItem(storageKey(),JSON.stringify(state));}catch(e){}
  updateCounters();
}
function updateCounters(){
  const totalJobs=Object.keys(state.jobs).length;
  const done=completedCount();
  const goalNum=parseInt(state.goal,10);
  const remaining=Number.isFinite(goalNum)?Math.max(goalNum-done,0):0;
  const counter=document.getElementById('counter');
  if(counter)counter.textContent=totalJobs+' jobs';
  const completedTotal=document.getElementById('completedTotal');
  if(completedTotal)completedTotal.textContent=done;
  const remainingTotal=document.getElementById('remainingTotal');
  if(remainingTotal)remainingTotal.textContent=remaining;
  const titleCounter=document.getElementById('completedBoxCounter');
  if(titleCounter)titleCounter.textContent=done;
}
function snapshot(){
  history.push(JSON.stringify(state));
  if(history.length>80)history.shift();
  redo=[];
}
function undo(){
  if(!history.length)return;
  redo.push(JSON.stringify(state));
  state=JSON.parse(history.pop());
  render();saveState();syncEntireBoard();
}
function redoChange(){
  if(!redo.length)return;
  history.push(JSON.stringify(state));
  state=JSON.parse(redo.pop());
  render();saveState();syncEntireBoard();
}
function locationKey(type,id,split){return type+':'+id+(split?':'+split:'');}
function removeFromLocations(jobId){
  Object.keys(state.locations).forEach(k=>{
    state.locations[k]=state.locations[k].filter(id=>id!==jobId);
    if(!state.locations[k].length)delete state.locations[k];
  });
}
function addToLocation(key,jobId){
  removeFromLocations(jobId);
  if(!state.locations[key])state.locations[key]=[];
  state.locations[key].push(jobId);
}
function jobsFor(key){return state.locations[key]||[];}
function setupDrop(el,key){
  el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drop-active')});
  el.addEventListener('dragleave',()=>el.classList.remove('drop-active'));
  el.addEventListener('drop',e=>{
    e.preventDefault();el.classList.remove('drop-active');

    snapshot();addToLocation(key,id);render();saveState();upsertRemoteJob(id);

function makeJob(jobId){

function makeArrow(def){

function validWeekDate(value){
  return /^(0?[1-9]|1[0-2])\/(0?[1-9]|[12][0-9]|3[01])$/.test(value);
}
function cleanWeekInput(value){
  let v=value.replace(/[^0-9/]/g,'');
  const parts=v.split('/');
  if(parts.length>2)v=parts[0]+'/'+parts.slice(1).join('');
  if(v.length>5)v=v.slice(0,5);
  return v;
}

      const next=cleanWeekInput(input.value);
      if(input.value!==next)input.value=next;
      state.weeks[i].date=input.value;

      saveState();queueRemoteSettings();
    });
    input.addEventListener('blur',()=>{
      if(input.value!==''&&!validWeekDate(input.value)){
        input.value='';state.weeks[i].date='';input.classList.remove('invalid');saveState();queueRemoteSettings();
      }
    });

async function saveBoardFile(){

  const json=safeStateJson();
  let html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  const re=/(<script id="initialBoardState" type="application\/json">)([\s\S]*?)(<\/script>)/;
  if(re.test(html)){
    html=html.replace(re,(_,openTag,oldJson,closeTag)=>openTag+json+closeTag);
  }
  const stamp=new Date().toISOString().slice(0,10);
  const filename='Production_Coordination_Board_'+stamp+'.html';
  const blob=new Blob([html],{type:'text/html'});
  if(window.showSaveFilePicker){
    try{
      const handle=await window.showSaveFilePicker({
        suggestedName:filename,
        types:[{description:'HTML file',accept:{'text/html':['.html']}}]
      });
      const writable=await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      return;
    }catch(e){
      if(e&&e.name==='AbortError')return;
    }
  }
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function clearBoard(){
  if(!confirm('Clear all jobs from this board? This keeps the goal and W/E color key.'))return;
  snapshot();
  state.jobs={};
  state.locations={};
  render();
  saveState();
  if(liveReady&&db){
    db.from('jobs').delete().eq('board_id',BOARD_ID).then(({error})=>{if(error)reportRemoteError(error,'Clearing jobs')});
  }
}

document.getElementById('goalInput').addEventListener('input',e=>{
  state.goal=e.target.value.replace(/[^0-9]/g,'');
  if(e.target.value!==state.goal)e.target.value=state.goal;
  saveState();queueRemoteSettings();
});
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(e.key==='Escape'&&!document.getElementById('boxZoomMenu').hidden){setBoxZoomMenu(false);return;}
  if(tag==='input'||tag==='textarea'||tag==='select')return;
  if(e.key==='1')openModal();
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redoChange()}
});

loadState();buildSwatches();render();initializeLiveBoard();
</script>
